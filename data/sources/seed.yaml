- brand: GL.iNet
  brand_slug: gl-inet
  kind: years_after_eol
  urls:
    - https://www.gl-inet.com/en-us/pages/psti
    - https://www.gl-inet.com/en-us/pages/psti-support-period
    - https://www.gl-inet.com/en-us/pages/firmware-versions/?status=ended
  note: "Support period runs 2 years from a product's end-of-life date. The second URL is the per-model table the GL.iNet records cite (24 models, \"June 11, 2027 or later\"). The third URL is the End of Life table the PSTI statement links, with EOL and Supported Until dates (Beryl GL-MT1300 cites it; Velica GL-B2200 has a record per page, D39)."
  last_checked: "2026-10-21"
  # The PSTI pages name no region and are recorded as UK, the regime they are published under; the firmware versions
  # table names no region either and is recorded as GLOBAL (D24).
  regions_by_url:
    https://www.gl-inet.com/en-us/pages/psti: [UK]
    https://www.gl-inet.com/en-us/pages/psti-support-period: [UK]
    https://www.gl-inet.com/en-us/pages/firmware-versions/?status=ended: [GLOBAL]
  # A PSTI support period row reads "June 11, 2027 or later*"; a Supported Until date in the firmware versions table is not a minimum.
  at_least:
    - "or later*"
  conditions:
    https://www.gl-inet.com/en-us/pages/psti-support-period:
      - "Pre-defined support period; the actual period is 2 years after GL.iNet announces end of life, so it can be longer."
    https://www.gl-inet.com/en-us/pages/firmware-versions/?status=ended:
      - "Status Maintenance: the model has reached end of life and GL.iNet lists a Supported Until date."
  notes:
    https://www.gl-inet.com/en-us/pages/psti-support-period:
      - "The page is GL.iNet's PSTI support period table and names no region; recorded as UK, the regime it is published under."
      - "The date is the pre-defined minimum, not a guaranteed end."
    https://www.gl-inet.com/en-us/pages/firmware-versions/?status=ended:
      - "GL.iNet's firmware versions table (columns Status, EOL Date, Supported Until; page names no region) gives EOL date {eol_date} and Supported Until {end_date}, recorded as GLOBAL (D24)."
  # The rows name the product and its model code; the Velica series is mesh (#49) and the GL-S models are hubs.
  category_map:
    - { model: 'Velica', category: mesh-wifi }
    - { model: '^GL-S\d', category: hub }
    - { model: 'GL-', category: router }
  min_rows:
    https://www.gl-inet.com/en-us/pages/psti-support-period: 20
    https://www.gl-inet.com/en-us/pages/firmware-versions/?status=ended: 1
  # The D39 records (Velica's two dates, Beryl's EOL-table date) carry notes that name the other page.
  parser_exceptions:
    - gl-inet-gl-b2200
    - gl-inet-gl-b2200-global
    - gl-inet-gl-mt1300

