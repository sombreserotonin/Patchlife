      - "Google's table lists this model as currently receiving critical security updates (checked {date}); the 5-year minimum has passed."
      - "Google's table lists this model as not currently receiving critical security updates (checked {date})."
    https://support.google.com/product-documentation/answer/14869041?hl=en:
      - "Also listed in Google's UK PSTI statement of compliance (April 2024), which applies where sold in the UK."
      - "Also listed in Google's UK PSTI (April 2024) and Australian Cyber Security Rules (February 2026) statements of compliance, each applying where sold in that country."
    https://support.google.com/product-documentation/answer/16888142?hl=en: &google-au-note
