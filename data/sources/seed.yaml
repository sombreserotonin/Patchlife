# Starting points for M1. Not evidence until a record quotes them.
# URLs found on 2026-10-21; entries marked 2024 come from a 2024 list and may have moved.
# last_checked: date this source was last fetched by the data refresh (null = never).
# date_order: how the pages write numeric dates, dmy (31/12/2027) or mdy (12/31/2027). npm run validate reads
# numeric dates in quotes from URLs starting with these in that order only, and rejects a quote whose numeric date
# could be read either way when no entry with a date_order covers its URL. Year-first dates (2029/12/31) need none.
# Profile fields (regions_by_url, at_least, conditions, notes, category_map, category_exceptions, versioned, min_rows,
# renames, parser_exceptions) describe how a source's pages state support, so npm run validate can check a record's
# judgement fields against them (rules R1 to R7 in scripts/validate-data.mjs; the schema describes each field) and a
# parser can regenerate them. A source without a field is not checked by that field's rule. Every sentence here is
# taken from the records on main, which were audited against the pages (D25: quote any value holding ": " or " #").

- brand: Ring
  brand_slug: ring
  kind: per_model_dates
  urls:
    - https://ring.com/gb/en/support/articles/ri2p1/Information-on-Ring-Devices-Software-Security-Updates
    - https://ring.com/au/en/support/articles/ri2p1/Information-on-Ring-Devices-Software-Security-Updates
    - https://ring.com/support/articles/ri2p1/Information-on-Ring-Devices-Software-Security-Updates
  note: Per-model "at least" dates in tables on the GB, AU and US pages; each page states the same purchase-channel rule (#105).
  last_checked: "2026-10-21"
  regions_by_url:
    https://ring.com/gb/en/support/articles/ri2p1/Information-on-Ring-Devices-Software-Security-Updates: [UK]
    https://ring.com/au/en/support/articles/ri2p1/Information-on-Ring-Devices-Software-Security-Updates: [AU]
    https://ring.com/support/articles/ri2p1/Information-on-Ring-Devices-Software-Security-Updates: [US]
  at_least:
    - "We'll support your device with software security updates until at least four years from when you bought it new on amazon.com where Amazon is the seller or on ring.com (or, in each case, until the date stated below if later)."
  conditions:
    https://ring.com/gb/en/support/articles/ri2p1/Information-on-Ring-Devices-Software-Security-Updates: &ring-conditions
      - "If bought new on ring.com, or on amazon.com where Amazon is the seller, at least four years from purchase or this date, whichever is later."
    https://ring.com/au/en/support/articles/ri2p1/Information-on-Ring-Devices-Software-Security-Updates: *ring-conditions
    https://ring.com/support/articles/ri2p1/Information-on-Ring-Devices-Software-Security-Updates: *ring-conditions
  # Ring's rows name only the product, so the category comes from the name. Elite 4K is the one name without "Cam".
  category_map:
    - { model: 'Doorbell|Door View Cam', category: doorbell }
    - { model: '\bCam\b', category: camera }
    - { model: 'Base Station|Bridge|Range Extender', category: hub }
    - { model: 'Sensor|Detector|Listener|Monitor', category: sensor }
    - { model: 'Bulb', category: smart-bulb }
    - { model: 'Smart Plug', category: smart-plug }
    - { model: 'Smart Light Switch', category: smart-switch }
    - { model: 'Chime|Keypad|Beacon|Car Tracker|Floodlight Wired|Intercom|Panic Button|Pathlight|Steplight|Wall Light|Spotlight Battery|Smart Fan Control|Smart Light Remote|Transformer', category: other }
  category_exceptions:
    ring-elite-4k: camera
  min_rows:
    https://ring.com/gb/en/support/articles/ri2p1/Information-on-Ring-Devices-Software-Security-Updates: 56
    https://ring.com/au/en/support/articles/ri2p1/Information-on-Ring-Devices-Software-Security-Updates: 44
    https://ring.com/support/articles/ri2p1/Information-on-Ring-Devices-Software-Security-Updates: 74
  # Ring's "product name changes" article (538eg) maps older names to the 2K and 4K names, in US, GB and AU copies; the
  # GB and AU copies write "Video" in the doorbell names. The 14 records that use these names quote the rows (#41).
  renames:
    - from: "Battery Doorbell (2nd Gen)"
      to: "Battery Doorbell 2K"
      urls: [&ring-renames-us https://ring.com/support/articles/538eg/ring-product-name-changes]
    - from: "Battery Video Doorbell (2nd Gen)"
      to: "Battery Doorbell 2K"
      urls: [&ring-renames-gb https://ring.com/gb/en/support/articles/538eg/ring-product-name-changes, &ring-renames-au https://ring.com/au/en/support/articles/538eg/ring-product-name-changes]
    - { from: "Battery Doorbell Plus (2nd Gen)", to: "Battery Doorbell 2K Plus", urls: [*ring-renames-us] }
    - { from: "Battery Video Doorbell Plus (2nd Gen)", to: "Battery Doorbell 2K Plus", urls: [*ring-renames-gb, *ring-renames-au] }
    - { from: "Battery Doorbell Pro (2nd Gen)", to: "Battery Doorbell 4K Pro", urls: [*ring-renames-us] }
    - { from: "Battery Video Doorbell Pro (2nd Gen)", to: "Battery Doorbell 4K Pro", urls: [*ring-renames-gb, *ring-renames-au] }
    - { from: "Wired Doorbell (2nd Gen)", to: "Wired Doorbell 2K", urls: [*ring-renames-us] }
    - { from: "Wired Video Doorbell (2nd Gen)", to: "Wired Doorbell 2K", urls: [*ring-renames-gb, *ring-renames-au] }
    - { from: "Wired Doorbell Plus (2nd Gen)", to: "Wired Doorbell 2K Plus", urls: [*ring-renames-us] }
    - { from: "Wired Video Doorbell Plus (2nd Gen)", to: "Wired Doorbell 2K Plus", urls: [*ring-renames-gb, *ring-renames-au] }
    - { from: "Wired Doorbell Pro (3rd Gen)", to: "Wired Doorbell 4K Pro", urls: [*ring-renames-us] }
    - { from: "Wired Video Doorbell Pro (3rd Gen)", to: "Wired Doorbell 4K Pro", urls: [*ring-renames-gb, *ring-renames-au] }
    - { from: "Wired Doorbell Elite (2nd Gen)", to: "Wired Doorbell 4K Elite", urls: [*ring-renames-us, *ring-renames-gb, *ring-renames-au] }
    - { from: "Floodlight Cam (2nd Gen)", to: "Floodlight Cam 2K", urls: [*ring-renames-us, *ring-renames-gb, *ring-renames-au] }
    - { from: "Floodlight Cam Pro (2nd Gen)", to: "Floodlight Cam 4K Pro", urls: [*ring-renames-us, *ring-renames-gb, *ring-renames-au] }
    - { from: "Indoor Cam Plus", to: "Indoor Cam 2K", urls: [*ring-renames-us, *ring-renames-gb, *ring-renames-au] }
    - { from: "Outdoor Cam Pro", to: "Outdoor Cam 4K Pro", urls: [*ring-renames-us, *ring-renames-gb, *ring-renames-au] }
    - { from: "Spotlight Cam (2nd Gen)", to: "Spotlight Cam 2K", urls: [*ring-renames-us, *ring-renames-gb, *ring-renames-au] }
    - { from: "Spotlight Cam Pro (2nd Gen)", to: "Spotlight Cam 4K Pro", urls: [*ring-renames-us, *ring-renames-gb, *ring-renames-au] }
  # The D33 splits (#42) and the two glass break sensors kept apart (#43) carry notes that name the other record; the
  # seed Floodlight Cam's note tells it from the 2K model; the Motion Sensor's note gives the US page's section.
  parser_exceptions:
    - ring-video-doorbell-4
    - ring-video-doorbell-4-us
    - ring-spotlight-cam-4k-pro
    - ring-spotlight-cam-4k-pro-au-us
    - ring-glass-break-sensor
    - ring-alarm-glass-break-sensor
    - ring-floodlight-cam
    - ring-motion-sensor

