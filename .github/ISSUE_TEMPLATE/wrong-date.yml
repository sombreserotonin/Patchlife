name: Wrong or outdated date
description: Report a support date that is wrong, outdated or missing.
title: "Correction: "
labels: ["data-correction"]
body:
  - type: input
    id: device
    attributes:
      label: Device
      description: Brand and model as shown on our page.
      placeholder: Ring Video Doorbell 3
    validations:
      required: true
  - type: input
    id: our-page
    attributes:
      label: Our page
      description: Link to the page with the wrong information, if you have it.
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: Manufacturer source
      description: Link to the maker's own page or statement of compliance. Retailer pages and forums can't be used as evidence.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What is wrong?
    validations:
      required: true
