name: Bug
description: Something on the site, extension or feed isn't working.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page or feature
      description: URL or name of the feature.
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser and device
    validations:
      required: false
