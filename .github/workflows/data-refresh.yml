name: Data refresh

# The weekly candidate PR with no model (docs/MIGRATION.md P3, decisions 4 and 5): each brand's parser reads its
# profiled page, candidates.mjs proposes changed rows first and then new rows (at most `limit`), the written records
# are verified, and the result is pushed to claude/data-auto-<date>-<run id> as patchlife-bot with a PR for the owner
# to review (RUNBOOKS O9). The schedule always acts (the DATA_REFRESH variable is no longer read, 13 Nov 2026): to
# pause it, disable this workflow in the Actions tab; the watchdog reports it until it is enabled again. While the
# last candidate PR is open the run skips, unless dispatched with refresh_open_pr, which re-runs the parsers on that PR's branch and pushes a new commit.
# A parser-gate mismatch or a page under its min_rows fails the run: that is the "parser broken" alarm.
on:
  schedule:
    - cron: '17 16 * * 0'
  workflow_dispatch:
    inputs:
      brands:
        description: Brands to parse, separated by spaces (empty means every brand with a parser)
        default: ''
      limit:
        description: At most this many rows written, changed rows first
        default: '60'
      refresh_open_pr:
        description: Re-run the parsers on the open candidate PR's branch and push a new commit to it
        type: boolean
        default: false

permissions:
  contents: read

# One group for every workflow that fetches makers' pages (decision 14), so two never run at once.
concurrency:
  group: crawl
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The inputs reach the shell through env, never inline; on a schedule they are empty and the defaults apply.
      BRANDS: ${{ inputs.brands }}
      LIMIT: ${{ inputs.limit || '60' }}
      REFRESH_OPEN_PR: ${{ inputs.refresh_open_pr == true && 'yes' || '' }}
      REPO: ${{ github.repository }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token is kept in the git configuration, so the steps that parse makers' pages can't read one there. The
          # repository is public, so fetching needs none; the push step passes the App's token to that one command.
          persist-credentials: false
      - id: open-pr
        name: Find the open candidate PR
        # One candidate PR at a time, so the owner is never asked to review two. The step's `branch` output is empty
        # when a new branch is to be made, or the open PR's branch when it is being refreshed.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          if ! [[ "$LIMIT" =~ ^[0-9]{1,5}$ ]]; then echo "::error::limit must be a whole number, not \"$LIMIT\""; exit 1; fi
          for brand in $BRANDS; do
            if ! [[ "$brand" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then echo "::error::\"$brand\" is not a brand slug"; exit 1; fi
          done
          # Only a branch in this repository counts. Anyone can open a PR from a fork's branch of the same name, and
          # that must neither stop the weekly run nor be fetched and pushed to.
          # The list is read whole and its first line taken after, so a failed call fails the step instead of reading
          # as "no PR open", which would open a second one.
          all=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate --jq '.[] | select((.head.ref | startswith("claude/data-auto-")) and .head.repo.full_name == env.REPO) | "\(.number) \(.head.ref)"')
          open=${all%%$'\n'*}
          if [ -n "$open" ] && [ -z "$REFRESH_OPEN_PR" ]; then
            echo "Skipped: candidate PR #${open%% *} (${open#* }) is still open. Review it (RUNBOOKS O9), or dispatch this workflow with refresh_open_pr to update it." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$open" ] && [ -n "$REFRESH_OPEN_PR" ]; then
            echo "::error::refresh_open_pr was set, but no candidate PR is open"
            exit 1
          fi
          if [ -n "$open" ]; then
            echo "main=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            # The parser step puts the refreshed brands' records back as main has them, so it must know which device
            # files a person edited on the branch: those that commits by anyone but the bot changed, merges aside.
            gh api "repos/$REPO/pulls/${open%% *}/commits?per_page=100" --paginate --jq '.[] | select(.author.login != env.BOT and (.parents | length) == 1) | .sha' > "$RUNNER_TEMP/hand-commits.txt"
            : > "$RUNNER_TEMP/hand-edited.txt"
            while read -r sha; do
              gh api "repos/$REPO/commits/$sha" --paginate --jq '.files[] | .filename, (.previous_filename // empty)' >> "$RUNNER_TEMP/hand-edited.txt"
            done < "$RUNNER_TEMP/hand-commits.txt"
            git fetch origin "${open#* }"
            git switch "${open#* }"
            echo "number=${open%% *}" >> "$GITHUB_OUTPUT"
            echo "branch=${open#* }" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.open-pr.outputs.skip != 'yes'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - if: steps.open-pr.outputs.skip != 'yes'
        # No package runs an install script today; none may start to in a job that holds the App's token.
        run: npm ci --ignore-scripts
      - name: Run the parsers
        if: steps.open-pr.outputs.skip != 'yes'
        # Exit 1 is the parser gate or the min_rows gate, a page that could not be read, or a registry that does not
        # validate: nothing was written, and the run goes red as the alarm.
        env:
          OPEN_BRANCH: ${{ steps.open-pr.outputs.branch }}
          MAIN_SHA: ${{ steps.open-pr.outputs.main }}
        run: |
          if [ -n "$OPEN_BRANCH" ]; then
            # RUNBOOKS O9: a refresh redoes the weekly run for its brands, from main's records and the branch's
            # profiles, so a row this PR wrote under an old name is written again from the fixed profile instead of
            # being read as a published record (audit 2026-11-14, workflows M4). A record a person changed on the
            # branch that differs from main's copy would be undone, so it stops the refresh instead.
            brands=$BRANDS
            if [ -z "$brands" ]; then brands=$(node --input-type=module -e 'const { PARSERS } = await import("./scripts/candidates.mjs"); console.log(Object.keys(PARSERS).join(" "))'); fi
            if [ -z "$brands" ]; then echo "::error::Could not list the brands with a parser"; exit 1; fi
            kept=""
            for brand in $brands; do
              while IFS= read -r file; do
                [ "$(git rev-parse -q --verify "HEAD:$file" || true)" = "$(git rev-parse -q --verify "$MAIN_SHA:$file" || true)" ] || kept="$kept $file"
              done < <(grep "^data/devices/$brand/" "$RUNNER_TEMP/hand-edited.txt" | sort -u)
            done
            if [ -n "$kept" ]; then
              echo "::error::Edited by hand on the PR's branch, so the refresh would undo them:$kept. Put each back as main has it (delete one the PR added), refresh, then make the edit again (RUNBOOKS O9)."
              exit 1
            fi
            for brand in $brands; do
              git rm -rq --ignore-unmatch -- "data/devices/$brand"
              if git cat-file -e "$MAIN_SHA:data/devices/$brand" 2>/dev/null; then git checkout -q "$MAIN_SHA" -- "data/devices/$brand"; fi
            done
          fi
          set +e
          # The log's copy is cleaned, here and in the next step, as in data-gate.yml: text from a maker's page must
          # not read as a workflow command. The file, and the summary made from it, keep the text as it was.
          node scripts/candidates.mjs --limit "$LIMIT" --report "$RUNNER_TEMP/report.json" $BRANDS 2>&1 | tee "$RUNNER_TEMP/candidates.txt" | sed -uE 's/::/: :/g; s/##\[/# #[/g'
          status=${PIPESTATUS[0]}
          set -e
          sed 's/^/    /' "$RUNNER_TEMP/candidates.txt" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::candidates.mjs exited $status: the parser gate or the min_rows gate failed, or a page could not be read. Nothing was written."
            exit 1
          fi
      - name: Verify the written records
        if: steps.open-pr.outputs.skip != 'yes'
        # Exit 1 means a written record failed or is stale, which the PR shows. page-hashes.json is restored so this PR
        # never conflicts with the nightly re-verification, which owns that file.
        env:
          OPEN_BRANCH: ${{ steps.open-pr.outputs.branch }}
        run: |
          ids=$(jq -r '.written[].id' "$RUNNER_TEMP/report.json" | tr '\n' ' ')
          if [ -z "${ids// }" ] && [ -n "$OPEN_BRANCH" ] && [ -n "$(git status --porcelain -- data)" ]; then
            echo "No row to write: the refresh takes the PR's earlier rows for its brands back out." | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/verify.txt"
            exit 0
          fi
          if [ -z "${ids// }" ]; then
            echo "Nothing to propose: no changed row and no new row within the limit." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "nothing=yes" >> "$GITHUB_ENV"
            exit 0
          fi
          set +e
          npm run verify:evidence -- $ids 2>&1 | tee "$RUNNER_TEMP/verify.txt" | sed -uE 's/::/: :/g; s/##\[/# #[/g'
          status=${PIPESTATUS[0]}
          set -e
          sed 's/^/    /' "$RUNNER_TEMP/verify.txt" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -gt 1 ] || ! grep -Eq '^[0-9]+ record\(s\) checked, [0-9]+ problem\(s\)$' "$RUNNER_TEMP/verify.txt"; then
            echo "::error::The verifier did not finish (exit $status)"
            exit 1
          fi
          git checkout -- data/sources/page-hashes.json
      - name: Validate and test
        if: steps.open-pr.outputs.skip != 'yes' && env.nothing != 'yes'
        run: |
          npm run validate
          npm test
      - name: List the dates no record quotes yet
        if: steps.open-pr.outputs.skip != 'yes' && env.nothing != 'yes'
        # For the PR body. It fetches the parsed pages again, so it runs here, in a step without the App's token, and
        # never stops the PR: a crash is said on the list's first line, which the body's 60-line cut keeps.
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then exit 0; fi
          status=0
          node scripts/unquoted-dates.mjs $(jq -r '[.pages[].url] | unique | .[]' "$RUNNER_TEMP/report.json") > "$RUNNER_TEMP/unquoted.txt" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            { echo "unquoted-dates.mjs exited $status, so this list may be incomplete"; cat "$RUNNER_TEMP/unquoted.txt"; } > "$RUNNER_TEMP/unquoted.tmp"
            mv "$RUNNER_TEMP/unquoted.tmp" "$RUNNER_TEMP/unquoted.txt"
          fi
      - name: Push and open the PR
        if: steps.open-pr.outputs.skip != 'yes' && env.nothing != 'yes'
        # A new branch and PR, or a new commit on the open PR's branch (never a force push). The body holds the change
        # table and the flags from the report, then the highlight links of the spot-check sample and the dates on the
        # parsed pages that no record quotes yet; only those last two are capped.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          OPEN_NUMBER: ${{ steps.open-pr.outputs.number }}
          OPEN_BRANCH: ${{ steps.open-pr.outputs.branch }}
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "Nothing to push: the written records did not change the tree." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          name="${APP_SLUG}[bot]"
          email="$(gh api "users/$name" --jq .id)+${name}@users.noreply.github.com"
          date=$(date -u +%F)
          report="$RUNNER_TEMP/report.json"
          written=$(jq -r '.written | length' "$report")
          {
            # A refresh replaces the body with its own rows, so it says so: rows of brands it did not parse are still
            # in the PR from earlier runs.
            if [ -n "$OPEN_BRANCH" ]; then echo "**This body lists only the rows of the refresh run on $date**, which put the records of ${BRANDS:-every brand with a parser} back as main has them and parsed again. Rows the PR's earlier runs wrote for other brands are in its earlier commits and in this description's edit history: review every record under Files changed (RUNBOOKS O9)."; echo; fi
            echo "Weekly data refresh of $date (docs/MIGRATION.md P3): $written record(s) proposed by \`scripts/candidates.mjs\`, changed rows first. Review it with RUNBOOKS O9, add \`audited\`, then squash and merge; or dispatch the workflow with \`refresh_open_pr\` after fixing a profile."
            echo
            echo "| Record | Change | Before | After |"
            echo "| --- | --- | --- | --- |"
            jq -r '.written[] | "| \(.id) | \(.kind) | \(if .before then "\(.before.end_date) \(if .before.at_least then "at least" else "" end) \(.before.conditions // "")" else "" end) | \(if .after then "\(.after.end_date) \(if .after.at_least then "at least" else "" end) \(.after.conditions // "")" else "new row" end) |"' "$report"
            echo
            # The flags quote makers' pages, so they go in a fence, one per line, as in the blocks below: GitHub
            # links, notifies and closes nothing there. Every flag starts with a fixed word, so none can end the fence.
            flags=$(jq -r '.flags[]? | tostring | gsub("\\s+"; " ")' "$report")
            if [ -n "$flags" ]; then echo "**Flags for a person:**"; echo '```'; printf '%s\n' "$flags"; echo '```'; echo; fi
            echo "Per page:"
            echo '```'
            grep -vE '^  (new|skipped): ' "$RUNNER_TEMP/candidates.txt" || true
            echo '```'
            echo
            echo "Verifier:"
            echo '```'
            tail -n 40 "$RUNNER_TEMP/verify.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$OPEN_BRANCH" ]; then
            branch="$OPEN_BRANCH"
            number="$OPEN_NUMBER"
          else
            branch="claude/data-auto-$date-$GITHUB_RUN_ID"
            git switch -c "$branch"
          fi
          git add data
          git -c user.name="$name" -c user.email="$email" commit -q -m "data: weekly refresh $date ($written records)" -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "$branch"
          if [ -z "$number" ]; then
            number=$(gh api -X POST "repos/$REPO/pulls" -f title="data: weekly refresh $date" -f head="$branch" -f base=main -F body=@"$RUNNER_TEMP/body.md" --jq .number)
          fi
          # The spot-check sample is seeded by the PR number, so it is added once the number exists.
          {
            echo
            if [ "$written" -gt 0 ]; then
              echo "**Spot check (RUNBOOKS O5 step 2), \`node scripts/audit-sample.mjs $number\`:**"
              echo '```'
              node scripts/audit-sample.mjs "$number" $(jq -r '.written[].id' "$report") | head -n 40
              echo '```'
              echo
            fi
            echo "**Dates on the parsed pages that no record quotes yet** (\`scripts/unquoted-dates.mjs\`, first 60 lines):"
            echo '```'
            head -n 60 "$RUNNER_TEMP/unquoted.txt"
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$RUNNER_TEMP/body.md"
          gh api -X PATCH "repos/$REPO/pulls/$number" -F body=@"$RUNNER_TEMP/body.md" > /dev/null
          echo "Pushed $branch and updated PR #$number: $GITHUB_SERVER_URL/$REPO/pull/$number" | tee -a "$GITHUB_STEP_SUMMARY"
