name: Data gate

# RUNBOOKS A9 as a required check (docs/MIGRATION.md decision 3). A PR may change data/ only in what a
# re-verification changes: verification blocks, empty archive links filled with a capture of the item's own page, and
# page-hashes.json. Anything more needs the `audited` label added by the repository owner (RUNBOOKS A8). The PR is
# judged by a clean copy of the base branch, with the base's scripts and the base's dependencies, so no code and no
# dependency a PR brings runs in this job. Every push removes `audited`, so each new push needs a fresh review; a
# fork's push can't remove it, so on a fork's PR only the run that the owner's own label starts passes. What this job
# can't stop: a PR that changes this workflow file is judged by its own copy of it, so the owner reads every PR that
# touches .github/ (a protected path). The job must be named data-gate: scripts/merge-bot.mjs requires a check run of
# that name on the head commit.
on:
  pull_request:
    # edited: a PR pointed at another base branch is judged again against that base.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: data-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  data-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Remove the audited label after a push
        # A fork's PR gets a read-only token, so there the label stays; the audit step below allows for that.
        if: github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'audited') && github.event.pull_request.head.repo.full_name == github.repository
        run: gh api -X DELETE "repos/$REPO/issues/$PR/labels/audited" > /dev/null
      - uses: actions/checkout@v7
        with:
          # The PR's merge commit: HEAD^1 is the base branch, so the diff against it is what the PR changes.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          # No npm cache here: its key would come from the PR's lockfile.
          node-version: 26
      - name: Check the data changes with the base branch's scripts
        id: gate
        # The base branch is checked out on its own, beside the PR, and its dependencies are installed there without
        # lifecycle scripts. Its copy of the script then reads the PR's tree from this folder. Nothing is installed
        # or run from the PR's own files: a file a PR adds under scripts/ or node_modules/ is never loaded.
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          (cd "$RUNNER_TEMP/base" && npm ci --ignore-scripts)
          if node "$RUNNER_TEMP/base/scripts/verification-only.mjs" HEAD^1; then
            echo "verified=yes" >> "$GITHUB_OUTPUT"
          else
            echo "verified=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Accept an audit by the repository owner
        # Only the owner's label counts: the App, or anyone else, can't audit a PR. For a branch in this repository
        # the last labeled or unlabeled event for `audited` decides, because the first step removes the label on
        # every push. A fork's push can't remove it, so there an earlier label says nothing about the latest commits:
        # only the run that the owner's own label starts passes, and any later push or edit turns the check red until
        # the owner removes the label and adds it again.
        if: steps.gate.outputs.verified == 'no'
        env:
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          if [ "$FORK" = true ]; then
            if [ "$ACTION" = labeled ] && [ "$LABEL" = audited ] && [ "$SENDER" = "$OWNER" ]; then
              echo "The data changes go beyond a re-verification, and $OWNER added the audited label to these commits of a fork's PR (RUNBOOKS A8)."
              exit 0
            fi
            echo "::error::The data changes go beyond a re-verification (RUNBOOKS A9). On a PR from a fork this check passes only on the run that $OWNER's own audited label starts: read the latest commits, then remove the label and add it again (RUNBOOKS A8)."
            exit 1
          fi
          actor=$(gh api "repos/$REPO/issues/$PR/events?per_page=100" --paginate --slurp |
            jq -r '[.[][] | select(.label.name == "audited")] | last | if . == null or .event != "labeled" then "" else .actor.login end')
          if [ -n "$actor" ] && [ "$actor" = "$OWNER" ]; then
            echo "The data changes go beyond a re-verification, and $OWNER added the audited label (RUNBOOKS A8)."
          else
            echo "::error::The data changes go beyond a re-verification (RUNBOOKS A9), and the PR has no audited label added by $OWNER (RUNBOOKS A8)."
            exit 1
          fi
