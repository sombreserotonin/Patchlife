name: Data gate

# RUNBOOKS A9 as a required check (docs/MIGRATION.md decision 3). A PR may change data/ only in what a
# re-verification changes: verification blocks, empty archive links filled with a capture of the item's own page, and
# page-hashes.json. Anything more needs the `audited` label added by the repository owner (RUNBOOKS A8).
#
# It runs on pull_request_target, so the copy of this file on the base branch is the one that runs, with the base
# branch's scripts and dependencies: a PR can change neither this gate nor the label job below. That event's token can
# write even on a fork's PR, so nothing here may run a file the PR brings: the PR's commit is fetched and checked out
# beside the trusted copy, and only read.
#
# The owner's label is written down as a commit status named `audited`, on the commit that was the PR's head when the
# label was added, with the base branch it was judged against. Only that status passes the audit, so a label can't
# carry over to a later commit or to another base. Every push removes the label as well.
#
# The job must be named data-gate: scripts/merge-bot.mjs and the ruleset require a check run of that name on the head
# commit.
on:
  pull_request_target:
    # edited: a PR pointed at another base branch is judged again against it.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

# Every event's run is kept and they go in order, so the run that records an audit is never dropped for a later one.
concurrency:
  group: data-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  data-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      OWNER: ${{ github.repository_owner }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.base_ref }}
      ACTION: ${{ github.event.action }}
      LABEL: ${{ github.event.label.name }}
      SENDER: ${{ github.event.sender.login }}
    steps:
      - name: Remove the audited label after a push
        # The label is for people: it shows that the PR was reviewed as it stands. The audit itself is the commit
        # status below, which a push leaves behind on the old commit.
        if: github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'audited')
        run: gh api -X DELETE "repos/$REPO/issues/$PR/labels/audited" > /dev/null || echo "The audited label was already gone."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch, never the PR: this copy's scripts are the ones that run. Whole history, so the commit the
          # PR branched from is found.
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No npm cache here, so nothing another run stored is restored into this job.
          node-version: 26
      - name: Check the data changes with the base branch's scripts
        id: gate
        env:
          # A PR can mark files for Git LFS. Nothing is downloaded for them.
          GIT_LFS_SKIP_SMUDGE: 1
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::The event names no head commit"; exit 1; }
          npm ci --ignore-scripts
          # The PR's commit is fetched by its id and checked out beside this copy: read, never run. What the PR changes
          # is the difference between that commit and the commit it branched from.
          git fetch --no-tags origin "$HEAD_SHA"
          base=$(git merge-base HEAD "$HEAD_SHA")
          git worktree add --detach "$RUNNER_TEMP/pr" "$HEAD_SHA"
          cd "$RUNNER_TEMP/pr"
          set +e
          node "$GITHUB_WORKSPACE/scripts/verification-only.mjs" "$base" > "$RUNNER_TEMP/gate.txt" 2>&1
          status=$?
          set -e
          # The file names in this output come from the PR, so control characters are dropped and nothing in it can
          # read as a workflow command. The runner takes `##[name]` anywhere in a line and `::name::` after any kind
          # of space, a no-break space included (tried on a runner, 13 Nov 2026), so every `::` and `##[` is broken up.
          tr -d '\000-\011\013-\037\177' < "$RUNNER_TEMP/gate.txt" | sed -E 's/::/: :/g; s/##\[/# #[/g'
          if [ "$status" -eq 0 ]; then
            echo "verified=yes" >> "$GITHUB_OUTPUT"
          else
            echo "verified=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Accept an audit by the repository owner
        # Only the owner's label counts: the App, or anyone else, can't audit a PR, and their label records nothing.
        # The owner's label is recorded for this commit and this base branch, and removing the label takes it back.
        # Only this job has the permission to write a status, and only one it wrote is read.
        if: steps.gate.outputs.verified == 'no'
        run: |
          record() { gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f context=audited -f state="$1" -f description="$2" > /dev/null; }
          pass() { echo "The data changes go beyond a re-verification, and $OWNER added the audited label on this commit (RUNBOOKS A8)."; exit 0; }
          refuse() { echo "::error::The data changes go beyond a re-verification (RUNBOOKS A9), and $OWNER has not added the audited label on this commit (RUNBOOKS A8)."; exit 1; }
          # The run that a label event starts decides from the event itself. GitHub may not list a status in the
          # second after it is written, so this run never reads back what it has just recorded.
          if [ "$LABEL" = audited ] && [ "$ACTION" = labeled ] && [ "$SENDER" = "$OWNER" ]; then
            record success "$BASE_REF"
            pass
          fi
          if [ "$LABEL" = audited ] && [ "$ACTION" = unlabeled ]; then
            record failure "the audited label was removed"
            refuse
          fi
          latest=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses?per_page=100" --jq '[.[] | select(.context == "audited")][0] | if . == null then "" else "\(.state) \(.creator.login) \(.description)" end')
          if [ "$latest" = "success github-actions[bot] $BASE_REF" ]; then pass; fi
          refuse

  protected-paths:
    # Labels PRs that change workflows, the rules and decisions files, dependencies, the scripts the bot and the gate
    # run, the source registry (its profiles are binding, D49) or the schemas, so only the owner merges them. It runs
    # here, from the base branch's copy, so a PR can't drop its own label, and it reads the PR's list of files, never
    # the files.
    if: contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Label protected-path changes
        run: |
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          protected=$(printf '%s\n' "$files" | grep -E '^(\.github/|\.claude/|\.agent/prompts/|CLAUDE\.md$|CONTRIBUTING\.md$|docs/DECISIONS\.md$|package(-lock)?\.json$|scripts/(merge-bot|watchdog|verification-only|validate-data)\.mjs$|data/sources/seed\.yaml$|data/schema/)' || true)
          # A registry change that moves only `last_checked` dates is a revisit, not a profile change (the same
          # exemption as the gate's, #146), so the nightly revisit PRs don't wait on a human. A missing patch counts
          # as a change: GitHub leaves the patch out of a large diff, and the `+` keeps that line through the grep.
          if [ "$protected" = "data/sources/seed.yaml" ]; then
            other=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | select(.filename == "data/sources/seed.yaml") | .patch // "+no patch"' | grep -E '^[-+]' | grep -vE '^[-+]  last_checked: ' || true)
            [ -z "$other" ] && protected=""
          fi
          # GitHub lists at most 3000 files of a PR, so a larger one may hold protected files this job never sees.
          if [ "$(printf '%s\n' "$files" | grep -c .)" -ge 3000 ]; then protected="3000 files or more"; fi
          if [ -n "$protected" ]; then
            gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=needs-human-merge" > /dev/null
            echo "::warning::Protected paths changed. A human must merge this PR."
          else
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/needs-human-merge" > /dev/null 2>&1 || true
          fi
