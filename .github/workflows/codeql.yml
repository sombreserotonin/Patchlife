name: CodeQL

# Code scanning for the scripts, the site's JavaScript and the workflow files. It stands in for GitHub's "default
# setup", which is a repository setting: don't switch that on as well, because GitHub refuses to run both. Alerts are
# at https://github.com/sombreserotonin/Patchlife/security/code-scanning (RUNBOOKS O12). Data and prose are not code,
# so a change to them alone starts no run; the weekly run scans with the newest queries.
on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['data/**', 'docs/**', '**/*.md']
  schedule:
    - cron: '37 3 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
      - name: List what the scan found
        # The alerts themselves are in the Security tab. This puts each finding's rule and place in the run's summary
        # and log as well, where they can be read without opening it. The text comes from the scanned files, so
        # nothing in it may read as a workflow command (as in data-gate.yml).
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          found=$(jq -r '.runs[].results[]? | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // "?") \(.message.text | gsub("\\s+"; " ") | .[0:160])"' sarif-results/*.sarif | sort | tr -d '\000-\011\013-\037\177' | sed -E 's/::/: :/g; s/##\[/# #[/g')
          {
            echo "## CodeQL: $LANGUAGE"
            echo
            if [ -n "$found" ]; then echo '```'; printf '%s\n' "$found"; echo '```'; else echo "No findings."; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
