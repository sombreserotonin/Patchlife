name: Probe hosts

# Checks robots.txt and the first cited page on each evidence host from a GitHub runner, to learn which hosts block
# runners before the nightly re-verify moves to Actions (docs/COSTS.md stage 1). Run it by hand. It is a report, so it
# passes even when hosts fail: read the log, one line per host.
on:
  workflow_dispatch:

permissions:
  contents: read

# The group of every workflow that fetches makers' pages (docs/MIGRATION.md decision 14).
concurrency:
  group: crawl
  cancel-in-progress: false
  queue: max

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node scripts/probe-hosts.mjs
