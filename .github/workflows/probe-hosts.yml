name: Probe hosts

# Checks robots.txt and the first cited page on each evidence host from a GitHub runner, so a host that starts to
# refuse runners can be told apart from a page that moved (RUNBOOKS O11). Run it by hand. It is a report, so it passes
# even when hosts fail: read the log, one line per host.
on:
  workflow_dispatch:

permissions:
  contents: read

# The group of every workflow that fetches makers' pages (docs/MIGRATION.md decision 14).
concurrency:
  group: crawl
  cancel-in-progress: false
  queue: max

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Probe each evidence host
        # A line can hold a URL a maker's server chose (a redirect's target), so the log's copy is cleaned, as in
        # data-gate.yml (D62); pipefail keeps the script's own exit status.
        run: |
          set -o pipefail
          node scripts/probe-hosts.mjs 2>&1 | sed -uE 's/::/: :/g; s/##\[/# #[/g'
