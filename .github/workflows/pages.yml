name: Pages

# Builds the site (D28) on every merge to main and daily just after 00:00 UTC, so status stays current (D7).
# Served at https://patchlife.tech from the site root, indexed, with a sitemap (PLAN M2).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Build the site
        run: npm run build:site
        env:
          SITE_URL: https://patchlife.tech
      - name: Lighthouse (M2 exit check)
        # Scored on a root build served locally, so canonical links point at the server being tested. Each page runs
        # three times and the gate uses the median, because one run on a shared runner can score far below the page
        # (Lighthouse docs/variability.md).
        run: |
          BASE_PATH= SITE_URL=http://localhost:8080 npm run build:site -- "$RUNNER_TEMP/lh-site"
          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$RUNNER_TEMP/lh-site" > /dev/null 2>&1 &
          sleep 2
          for run in 1 2 3; do
            npx lighthouse http://localhost:8080/ --only-categories=performance,accessibility,seo --output=json --output-path="$RUNNER_TEMP/lh-home-$run.json" --chrome-flags="--headless=new --no-sandbox" --quiet
            npx lighthouse http://localhost:8080/devices/ring-video-doorbell-3/ --only-categories=performance,accessibility,seo --output=json --output-path="$RUNNER_TEMP/lh-model-$run.json" --chrome-flags="--headless=new --no-sandbox" --quiet
          done
          node -e '
            let failed = false;
            for (const name of ["home", "model"]) {
              const runs = [1, 2, 3].map((run) => JSON.parse(require("fs").readFileSync(`${process.env.RUNNER_TEMP}/lh-${name}-${run}.json`, "utf8")).categories);
              for (const id of Object.keys(runs[0])) {
                const scores = runs.map((categories) => Math.round(categories[id].score * 100)).sort((a, b) => a - b);
                console.log(`${name} ${id}: median ${scores[1]} (runs ${scores.join(", ")})`);
                if (scores[1] < 90) failed = true;
              }
            }
            if (failed) { console.error("A median Lighthouse score is under 90"); process.exit(1); }'
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
